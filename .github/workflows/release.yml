name: Release

on:
  push:
    tags: ['v*.*.*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run release validation without publishing to npm'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/ci-cd.yml

  validate:
    name: Validate release
    if: >-
      always() &&
      (needs.ci.result == 'success' || needs.ci.result == 'skipped')
    runs-on: ubuntu-latest
    needs: ci
    outputs:
      version: ${{ steps.package.outputs.version }}
      should_publish: ${{ steps.mode.outputs.publish }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org/'
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@^11.5.1
          npm --version

      - name: Read package metadata
        id: package
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"

      - name: Resolve release mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require a version tag for publishing
        if: steps.mode.outputs.publish == 'true'
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*.*.*) ;;
            *)
              echo "::error::Publishing must run from a version tag, got $GITHUB_REF"
              exit 1
              ;;
          esac

      - name: Validate tag and package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="${{ steps.package.outputs.version }}"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Validate semantic version
        run: |
          echo "${{ steps.package.outputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "::error::Invalid semver: ${{ steps.package.outputs.version }}"; exit 1; }

      - name: Validate changelog entry
        run: |
          grep -q "\[${{ steps.package.outputs.version }}\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no entry for ${{ steps.package.outputs.version }}"; exit 1; }

      - name: Validate npm package metadata
        run: |
          cp package.json /tmp/package.json.before
          npm pkg fix
          if ! cmp -s package.json /tmp/package.json.before; then
            echo "::error::package.json is not normalized; run 'npm pkg fix' and commit the result"
            git --no-pager diff -- package.json
            exit 1
          fi

      - name: Reject an existing npm version
        run: |
          if npm view "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}" version >/dev/null 2>&1; then
            echo "::error::${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }} is already published"
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      - name: Validate build output
        run: |
          for file in dist/index.js dist/index.d.ts; do
            [ -s "$file" ] || { echo "::error::Missing build artifact: $file"; exit 1; }
          done
          node -e "const moduleExports=require('./dist/index.js'); if(Object.keys(moduleExports).length===0) throw new Error('Package has no CommonJS exports')"

      - name: Inspect package tarball
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const [pack] = require('/tmp/pack.json');
            const files = pack.files.map(file => file.path);
            const leaked = files.filter(file => /^(src|test|test-results|coverage|\.github)\//.test(file));
            if (leaked.length) {
              console.error('Unexpected package files:', leaked);
              process.exit(1);
            }
            if (!files.some(file => file.startsWith('dist/'))) {
              console.error('Package does not contain dist/');
              process.exit(1);
            }
            console.log('Tarball validated:', files.length, 'files,', pack.size, 'bytes');
          "

      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/
          retention-days: 7

  publish:
    name: Publish to npm
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    needs: validate
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org/'
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@^11.5.1
          npm --version

      - run: npm ci
      - run: npm run build

      - name: Verify GitHub OIDC availability
        if: needs.validate.outputs.should_publish == 'true'
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL" \
            || { echo "::error::GitHub did not expose the OIDC request URL"; exit 1; }
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            || { echo "::error::GitHub did not expose the OIDC request token"; exit 1; }

      - name: Publish with npm trusted publishing
        if: needs.validate.outputs.should_publish == 'true'
        run: npm publish --access public --provenance

      - name: Test npm publication
        if: needs.validate.outputs.should_publish == 'false'
        run: npm publish --access public --dry-run

      - name: Create GitHub release
        if: needs.validate.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "GitHub release $VERSION_TAG already exists"
          else
            gh release create "$VERSION_TAG" --verify-tag --title "$VERSION_TAG" --generate-notes
          fi

      - name: Write release summary
        if: needs.validate.outputs.should_publish == 'true'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          printf "### Published \`%s\`\n" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo 'https://www.npmjs.com/package/@resilientmq/core' >> "$GITHUB_STEP_SUMMARY"

      - name: Write dry-run summary
        if: needs.validate.outputs.should_publish == 'false'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: printf "### Dry run completed for \`%s\`\n" "$VERSION" >> "$GITHUB_STEP_SUMMARY"
